name: Manual macOS native diagnostics
# Focused host symbol-isolation control covers both C++ and Objective-C++ objects.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Isolated Release parity capture, focused smoke, or native profile diagnostics
        default: smoke-repro
        options: [smoke-repro, Release-build-probe, Release-parity-capture, Host-boundary-capture, Release, Debug, asan-ubsan, tsan]
      optimize-build:
        type: boolean
        description: Measure cold build-local JUCE cache; prove Release before other profiles
        default: false
      architecture:
        type: choice
        description: Native runner and build architecture; never share caches across architectures
        default: x86_64
        options: [x86_64, arm64]
  push:
    branches: [ci/macos-130-qualification]
    paths: [.github/workflows/macos-intel-native-diagnostics.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: sw2-intel-diagnostics-${{ github.ref }}-${{ inputs.profile || 'smoke-repro' }}-${{ inputs.architecture || 'x86_64' }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: diagnostic (${{ inputs.architecture || 'x86_64' }})
    if: github.repository == 'RIG-AUDIO/SW2'
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - if: inputs.profile != 'Release-parity-capture' && inputs.profile != 'Host-boundary-capture'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          run-id: 41924729723
          name: UNQUALIFIED-universal-AU-VST3-3a287d0764cbbd57285582a25aa41b58ed6b03b1-1
          path: ${{ runner.temp }}/approved-candidate
      - name: Native diagnostics; technical result is not reference approval
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DIAGNOSTIC_PROFILE: ${{ inputs.profile || 'smoke-repro' }}
          OPTIMIZE_BUILD: ${{ inputs.optimize-build || false }}
          DIAGNOSTIC_ARCH: ${{ inputs.architecture || 'x86_64' }}
        run: |
          if [[ "$DIAGNOSTIC_PROFILE" == Host-boundary-capture ]]; then
            python3 scripts/macos/host_boundary.py --arch "$DIAGNOSTIC_ARCH" --root "$RUNNER_TEMP/native-diagnostic"
            exit $?
          fi
          if [[ "$DIAGNOSTIC_PROFILE" == Release-parity-capture ]]; then
            python3 scripts/macos/parity_probe.py --arch "$DIAGNOSTIC_ARCH" --root "$RUNNER_TEMP/native-diagnostic"
            exit $?
          fi
          options=()
          if [[ "$OPTIMIZE_BUILD" == true ]]; then options+=(--optimize-build); fi
          python3 scripts/macos/intel_diagnostics.py --profile "$DIAGNOSTIC_PROFILE" --arch "$DIAGNOSTIC_ARCH" "${options[@]}" \
            --root "$RUNNER_TEMP/native-diagnostic" --candidate-download "$RUNNER_TEMP/approved-candidate"
      - name: Verify owned AU cleanup after failure
        if: always()
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/ci.py cleanup --source-sha "$GITHUB_SHA"
          --base-source-sha 5e7b967db0b52f773f382217a72c6c0c3ff6b8f7 --mode full
          --root "$RUNNER_TEMP/native-diagnostic"
      - name: Preserve separate profile evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-diagnostic-${{ inputs.architecture || 'x86_64' }}-${{ inputs.profile || 'smoke-repro' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-diagnostic/*.json
            ${{ runner.temp }}/native-diagnostic/*.log
            ${{ runner.temp }}/native-diagnostic/*.xml
            ${{ runner.temp }}/native-diagnostic/*.png
            ${{ runner.temp }}/native-diagnostic/captures/**/*.f32
            ${{ runner.temp }}/native-diagnostic/captures/**/*.json
            ${{ runner.temp }}/native-diagnostic/capture-drivers/manifest.json
            ${{ runner.temp }}/native-diagnostic/boundary/**/*.csv
            ${{ runner.temp }}/native-diagnostic/boundary/**/*.f32
            ${{ runner.temp }}/native-diagnostic/boundary/**/*.json
            ${{ runner.temp }}/native-diagnostic/owned-login-*/*.log
            ${{ runner.temp }}/native-diagnostic/owned-login-*/cleanup.json
          if-no-files-found: error
          retention-days: 7
